# Локальная разработка: docker-compose CLI подхватывает этот файл автоматически
# поверх docker-compose.yml при обычном `docker compose up` (без -f).
#
# Даёт hot reload через `dotnet watch` (см. dev-стадию в Dockerfile каждого сервиса):
# исходники монтируются как volume, изменения в .cs подхватываются без пересборки
# образа. Применение миграций при старте не требует отдельной настройки здесь —
# каждый сервис вызывает `dbContext.Database.MigrateAsync()` в своём Program.cs
# при любом запуске (см. CLAUDE.md), в т.ч. и в dev-режиме.
services:
  cargoservice:
    build:
      target: dev
    volumes:
      # Весь репозиторий, не только services/identity-service — сервис ссылается на
      # shared/CargoService.Contracts, которая иначе не была бы видна dotnet watch
      # внутри контейнера. dotnet watch следит только за файлами графа проекта
      # (services/identity-service/** + shared/CargoService.Contracts/**), так что
      # изменения в других services/{other-service}/ ни на что не влияют.
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  clientsservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  pricingservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  ordersservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  cargoshipments:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  filestorage:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  notificationservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  aiinspectionservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  documentservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  paymentservice:
    build:
      target: dev
    volumes:
      - .:/src
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  # Остальные сервисы получают аналогичный override (build.target: dev, volume
  # на весь репозиторий) по мере появления их Dockerfile-ов.
