services:
  # Единый Postgres-инстанс для локальной разработки, база+пользователь на сервис
  # (database-per-service, см. docker/init-db.sql). Каждый новый сервис добавляет
  # свой CREATE USER/DATABASE блок в init-db.sql и свою переменную подключения ниже.
  postgres:
    image: postgres:16-alpine
    container_name: cargoservice-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cargoservice-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cargoservice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Локальный сборщик почты для notification-service: принимает SMTP на 1025 и
  # показывает письма в UI на http://localhost:8025, наружу ничего не отправляя.
  # Mailpit, а не более известный MailHog: последний архивирован автором и
  # обновлений не получает. В проде эти же настройки Smtp:* указывают на
  # настоящего провайдера (SendGrid/Mailgun принимают почту тем же SMTP).
  mailpit:
    image: axllent/mailpit:latest
    container_name: cargoservice-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI

  # Централизованное логирование: каждый сервис пишет структурные логи через
  # Serilog в Seq (см. CLAUDE.md). UI: http://localhost:5341
  seq:
    image: datalust/seq:latest
    container_name: cargoservice-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  # Identity provider: realm/client/roles определены как код в
  # docker/keycloak/realm-export.json и импортируются при каждом старте
  # (--import-realm). KC_HOSTNAME фиксирован на localhost — это же значение
  # попадает в claim `iss` выпущенных токенов, поэтому Keycloak__ValidIssuer
  # у identity-service всегда localhost:8080, независимо от того, как сам
  # сервис физически достучался до Keycloak (см. CLAUDE.md).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cargoservice-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Контекст сборки — корень репозитория, а не services/identity-service: сервис
  # ссылается на shared/CargoService.Contracts, которая лежит вне его собственной
  # папки и иначе была бы недостижима для Docker (см. комментарий в Dockerfile).
  cargoservice:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: cargoservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cargoservice;Username=cargoservice;Password=cargoservice
      Keycloak__BaseUrl: http://keycloak:8080
      RabbitMQ__HostName: rabbitmq
      Seq__ServerUrl: http://seq:80
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started

  # Контекст сборки — корень репозитория: ClientsService.Infrastructure ссылается
  # на shared/CargoService.Contracts (consumer UserRegistered), та же причина,
  # что у cargoservice выше.
  clientsservice:
    build:
      context: .
      dockerfile: services/clients-service/Dockerfile
    container_name: clientsservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=clientsservice;Username=clientsservice;Password=clientsservice
      Keycloak__BaseUrl: http://keycloak:8080
      RabbitMQ__HostName: rabbitmq
      Seq__ServerUrl: http://seq:80
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started

  # Контекст сборки — корень репозитория: PricingService.Application/Infrastructure
  # ссылаются на shared/CargoService.Contracts (outbox TariffChanged), та же причина,
  # что у cargoservice/clientsservice выше.
  pricingservice:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    container_name: pricingservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pricingservice;Username=pricingservice;Password=pricingservice
      Keycloak__BaseUrl: http://keycloak:8080
      RabbitMQ__HostName: rabbitmq
      Seq__ServerUrl: http://seq:80
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started

  # Контекст сборки — корень репозитория: OrdersService.Application/Infrastructure
  # ссылаются на shared/CargoService.Contracts (outbox OrderCreated/OrderConfirmed/
  # OrderCancelled, consumers TariffChanged/CargoStatusChanged/PaymentCompleted), та же
  # причина, что у cargoservice/clientsservice/pricingservice выше. PricingService__BaseUrl
  # указывает на pricingservice внутри docker-сети — для синхронного вызова pricing.calculate
  # при создании заявки.
  ordersservice:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    container_name: ordersservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ordersservice;Username=ordersservice;Password=ordersservice
      Keycloak__BaseUrl: http://keycloak:8080
      PricingService__BaseUrl: http://pricingservice:8080
      RabbitMQ__HostName: rabbitmq
      Seq__ServerUrl: http://seq:80
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      pricingservice:
        condition: service_started
      seq:
        condition: service_started

  # Контекст сборки — корень репозитория: CargoService.Application/Infrastructure ссылаются
  # на shared/CargoService.Contracts (consumer OrderConfirmed/PackageIntegrityAssessed, outbox
  # событий груза), та же причина, что у сервисов выше. Имя cargoshipments, а не cargoservice:
  # последнее занято identity-service (наследие названия платформы, см. README сервиса).
  cargoshipments:
    build:
      context: .
      dockerfile: services/cargo-service/Dockerfile
    container_name: cargoshipments-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cargoshipments;Username=cargoshipments;Password=cargoshipments
      Keycloak__BaseUrl: http://keycloak:8080
      KeycloakServiceAccount__BaseUrl: http://keycloak:8080
      FileStorageService__BaseUrl: http://filestorage:8080
      RabbitMQ__HostName: rabbitmq
      Seq__ServerUrl: http://seq:80
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      filestorage:
        condition: service_started
      seq:
        condition: service_started

  # Контекст сборки — корень репозитория. На shared/CargoService.Contracts этот сервис, в отличие
  # от остальных, не ссылается (в обмене событиями он не участвует), но Directory.Build.props и
  # Directory.Packages.props лежат в корне и нужны любому проекту — из папки сервиса они
  # недостижимы. Своей БД у сервиса нет: состояние целиком в MinIO. Minio__PublicEndpoint
  # переопределяет хост в выданных presigned-ссылках — сервис ходит в хранилище как `minio:9000`,
  # а открывать ссылку будет браузер клиента, знающий его только как `localhost:9000`.
  filestorage:
    build:
      context: .
      dockerfile: services/file-storage-service/Dockerfile
    container_name: filestorage-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Keycloak__BaseUrl: http://keycloak:8080
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: localhost:9000
      Seq__ServerUrl: http://seq:80
    ports:
      - "8086:8080"
    depends_on:
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started

  notificationservice:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notificationservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=notificationservice;Username=notificationservice;Password=notificationservice
      Keycloak__BaseUrl: http://keycloak:8080
      RabbitMQ__HostName: rabbitmq
      Smtp__Host: mailpit
      Seq__ServerUrl: http://seq:80
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started
      seq:
        condition: service_started

  # Остальные сервисы добавляются сюда по мере реализации их Dockerfile-ов
  # (см. spec.md, Фазы 7-11), а также api-gateway — по мере реализации Фазы 12.

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  seq_data:
