services:
  # Единый Postgres-инстанс для локальной разработки, база+пользователь на сервис
  # (database-per-service, см. docker/init-db.sql). Каждый новый сервис добавляет
  # свой CREATE USER/DATABASE блок в init-db.sql и свою переменную подключения ниже.
  postgres:
    image: postgres:16-alpine
    container_name: cargoservice-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cargoservice-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cargoservice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Централизованное логирование: каждый сервис пишет структурные логи через
  # Serilog в Seq (см. CLAUDE.md). UI: http://localhost:5341
  seq:
    image: datalust/seq:latest
    container_name: cargoservice-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cargoservice-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  cargoservice:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: cargoservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cargoservice;Username=cargoservice;Password=cargoservice
      Keycloak__Authority: http://keycloak:8080/realms/master
      Keycloak__MetadataAddress: http://keycloak:8080/realms/master/.well-known/openid-configuration
      Seq__ServerUrl: http://seq:80
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started

  # Остальные сервисы (orders-service, cargo-service, pricing-service, ...) добавляются
  # сюда по мере реализации их Dockerfile-ов (см. spec.md, Фазы 1-12), а также
  # api-gateway — по мере реализации Фазы 12.

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  seq_data:
